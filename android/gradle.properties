org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=true
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true
# Suppress V1 embedding warnings and remove V1 dependencies
android.suppressUnsupportedCompileSdkWarning=true
# Enable parallel build and incremental compilation
org.gradle.parallel=true
org.gradle.workers.max=8
# Disable legacy AGP behavior
android.disableResourceValidation=true
# Suppress missing dependency warnings
android.suppressMissingDimensionWarning=true
